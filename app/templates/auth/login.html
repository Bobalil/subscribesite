{% extends "base.html" %}
{% block content %}
<h1>Вход</h1>

{% if error %}
<div style="color:#b00;margin-bottom:12px">{{ error }}</div>
{% endif %}

<form method="post" action="/auth/login-form" style="max-width:420px;display:flex;flex-direction:column;gap:10px">
  <label>Email
    <input name="email" type="email" required>
  </label>
  <label>Пароль
    <input name="password" type="password" required>
  </label>
  <button type="submit">Войти</button>
</form>

<p>Нет аккаунта? <a href="/auth/register">Зарегистрироваться</a></p>
{% endblock %}
