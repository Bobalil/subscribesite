# fly.toml app configuration file generated for subscribesite on 2026-11-21T10:01:36Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'subscribesite'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
