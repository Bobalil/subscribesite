<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Единый кошелёк подписок</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f35; --accent:#5b8cff; --ok:#2ecc71; --muted:#8b93b0; --text:#e8ebf5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 24px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #262c47; }
  header h1 { font-size:18px; margin:0; }
  .balance { background:var(--card); padding:10px 16px; border-radius:12px; font-weight:600; }
  .balance span { color:var(--ok); }
  main { max-width:960px; margin:0 auto; padding:24px; display:grid; gap:24px; }
  .panel { background:var(--card); border-radius:16px; padding:20px; }
  .panel h2 { margin:0 0 16px; font-size:16px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  .topup { display:flex; gap:10px; flex-wrap:wrap; }
  .topup input { flex:1; min-width:140px; padding:12px; border-radius:10px; border:1px solid #2f3654; background:#12162a; color:var(--text); font-size:15px; }
  button { cursor:pointer; border:none; border-radius:10px; padding:12px 18px; font-size:15px; font-weight:600; background:var(--accent); color:#fff; transition:.15s; }
  button:hover { filter:brightness(1.1); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:#2a3150; }
  .subs { display:grid; gap:10px; }
  .sub { display:flex; align-items:center; gap:14px; padding:14px; border-radius:12px; background:#12162a; border:1px solid #232a45; }
  .sub .icon { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; font-size:20px; background:#232a45; }
  .sub .info { flex:1; }
  .sub .info b { display:block; font-size:15px; }
  .sub .info small { color:var(--muted); }
  .sub .price { font-weight:700; white-space:nowrap; }
  .total { display:flex; justify-content:space-between; align-items:center; padding-top:16px; border-top:1px solid #232a45; margin-top:16px; }
  .total b { font-size:20px; }
  .history { display:grid; gap:8px; font-size:14px; }
  .history .row { display:flex; justify-content:space-between; padding:10px 12px; background:#12162a; border-radius:10px; }
  .history .row .neg { color:#ff7b7b; }
  .history .row .pos { color:var(--ok); }
  .empty { color:var(--muted); font-size:14px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#2ecc71; color:#08210f; padding:12px 20px; border-radius:12px; font-weight:600; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>💳 Единый кошелёк подписок</h1>
  <div class="balance">Баланс: <span id="bal">0</span> ₽</div>
</header>

<main>
  <section class="panel">
    <h2>Пополнить кошелёк (демо)</h2>
    <div class="topup">
      <input id="amount" type="number" min="1" placeholder="Сумма, ₽" value="1000">
      <button onclick="topup()">Пополнить</button>
      <button class="ghost" onclick="reset()">Сбросить демо</button>
    </div>
    <p class="empty" style="margin-top:10px">В реальном проекте здесь будет кнопка СБП (QR) и эквайринг.</p>
  </section>

  <section class="panel">
    <h2>Мои подписки</h2>
    <div class="subs" id="subs"></div>
    <div class="total">
      <span>Итого к оплате за месяц</span>
      <b id="total">0 ₽</b>
    </div>
    <div style="margin-top:16px">
      <button id="payBtn" onclick="payAll()">Оплатить всё одной транзакцией</button>
    </div>
  </section>

  <section class="panel">
    <h2>История операций</h2>
    <div class="history" id="history"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const CATALOG = [
  { id:'yandex',  name:'Яндекс Плюс',        price:399,  icon:'🎵' },
  { id:'kinopoisk',name:'Кинопоиск',         price:499,  icon:'🎬' },
  { id:'ivi',     name:'IVI',                price:399,  icon:'📺' },
  { id:'spotify', name:'Spotify (зарубеж.)', price:299,  icon:'🎧' },
  { id:'chatgpt', name:'ChatGPT Plus',       price:1990, icon:'🤖' },
  { id:'hosting', name:'Хостинг сайта',      price:450,  icon:'🌐' },
];

const state = load();
function load() {
  const raw = localStorage.getItem('subs_demo');
  if (raw) return JSON.parse(raw);
  return { balance: 0, subs: CATALOG.map(s => ({ ...s, active:true })), history: [] };
}
function save() { localStorage.setItem('subs_demo', JSON.stringify(state)); }

function fmt(n) { return n.toLocaleString('ru-RU') + ' ₽'; }

function render() {
  document.getElementById('bal').textContent = state.balance.toLocaleString('ru-RU');
  const active = state.subs.filter(s => s.active);
  const total = active.reduce((a,s) => a + s.price, 0);
  document.getElementById('total').textContent = fmt(total);

  document.getElementById('subs').innerHTML = state.subs.map(s => `
    <label class="sub">
      <input type="checkbox" ${s.active?'checked':''} onchange="toggle('${s.id}')">
      <div class="icon">${s.icon}</div>
      <div class="info"><b>${s.name}</b><small>ежемесячно</small></div>
      <div class="price">${fmt(s.price)}</div>
    </label>
  `).join('');

  const btn = document.getElementById('payBtn');
  btn.disabled = total === 0;
  btn.textContent = total === 0 ? 'Нет выбранных подписок' : `Оплатить всё — ${fmt(total)}`;

  const h = state.history;
  document.getElementById('history').innerHTML = h.length
    ? h.map(x => `<div class="row"><span>${x.d}</span><span class="${x.sum<0?'neg':'pos'}">${x.sum>0?'+':''}${fmt(Math.abs(x.sum)).replace(' ₽','')} ₽</span></div>`).join('')
    : '<div class="empty">Пока пусто</div>';
}

function toggle(id) {
  const s = state.subs.find(x => x.id === id);
  s.active = !s.active;
  save(); render();
}

function topup() {
  const v = parseInt(document.getElementById('amount').value, 10);
  if (!v || v <= 0) return toast('Введите сумму', false);
  state.balance += v;
  addHistory(`Пополнение кошелька`, v);
  save(); render(); toast('Кошелёк пополнен');
}

function payAll() {
  const active = state.subs.filter(s => s.active);
  const total = active.reduce((a,s) => a + s.price, 0);
  if (total === 0) return;
  if (state.balance < total) return toast('Недостаточно средств — пополните кошелёк', false);
  state.balance -= total;
  addHistory(`Оплата ${active.length} подписок`, -total);
  save(); render(); toast(`Оплачено ${fmt(total)} — одной транзакцией`);
}

function addHistory(d, sum) {
  const now = new Date().toLocaleString('ru-RU');
  state.history.unshift({ d: `${d} · ${now}`, sum });
  state.history = state.history.slice(0, 20);
}

function reset() {
  if (!confirm('Сбросить демо-данные?')) return;
  localStorage.removeItem('subs_demo');
  location.reload();
}

let toastTimer;
function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = ok ? '#2ecc71' : '#ff7b7b';
  el.style.color = ok ? '#08210f' : '#2a0808';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

render();
</script>
</body>
</html>
